<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Joystick Monitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>ESP32 Joystick Monitor</h1>
    <canvas id="joy" width="260" height="260"></canvas>
    <div class="log">
      <div><strong>Direction:</strong> <span id="dir">-</span></div>
      <div><strong>Speed:</strong> <span id="speed">-</span></div>
      <div id="status">Connecting...</div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
